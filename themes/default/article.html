<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - {{siteName}}</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        
        .article-content {
            line-height: 1.8;
            max-width: 100%;
            overflow-wrap: break-word;
            color: #334155;
            font-size: 1.05rem;
        }
        
        .article-content h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 2.5rem 0 1.5rem;
            line-height: 1.2;
            color: #0f172a;
        }
        
        .article-content h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #eef2ff;
            color: #1e293b;
        }
        
        .article-content h3 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 1.75rem 0 0.75rem;
            color: #334155;
        }
        
        .article-content p {
            margin-bottom: 1.25rem;
        }
        
        .article-content blockquote {
            border-left: 4px solid #4f46e5;
            padding: 1.25rem 1.5rem;
            margin: 1.75rem 0;
            font-style: italic;
            background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 100%);
            border-radius: 0 16px 16px 0;
            color: #475569;
        }
        
        .article-content code {
            background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 100%);
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            font-size: 0.9em;
            color: #4f46e5;
            font-family: 'Fira Code', 'SF Mono', monospace;
        }
        
        .article-content pre {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            padding: 1.5rem;
            border-radius: 16px;
            overflow-x: auto;
            margin: 1.75rem 0;
            font-size: 0.9rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .article-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }
        
        .article-content ul, .article-content ol {
            padding-left: 1.5rem;
            margin: 1.25rem 0;
        }
        
        .article-content li {
            margin: 0.5rem 0;
        }
        
        .article-content li::marker {
            color: #4f46e5;
        }
        
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.75rem 0;
            font-size: 0.95rem;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        
        .article-content table th,
        .article-content table td {
            padding: 0.875rem 1rem;
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        
        .article-content table th {
            background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 100%);
            font-weight: 600;
            color: #4f46e5;
        }
        
        .article-content table tr:nth-child(even) {
            background: rgba(238, 242, 255, 0.3);
        }
        
        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 1.75rem 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        
        .article-content a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .article-content a:hover {
            color: #7c3aed;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        
        .category-badge {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: #4f46e5;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .btn-share {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            color: #64748b;
            text-decoration: none;
        }
        
        .btn-share:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            color: #4f46e5;
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }
        
        .footer-custom {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(99, 102, 241, 0.08);
        }
    </style>
    
    {{codeBeforHead}}
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="navbar-custom sticky-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-3">
                <a href="/" class="d-flex align-items-center text-decoration-none">
                    <div class="rounded-3 d-flex align-items-center justify-content-center me-3" 
                         style="width: 44px; height: 44px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                        <i class="fas fa-feather-alt text-white fs-5"></i>
                    </div>
                    <span class="fs-5 fw-bold text-dark">{{siteName}}</span>
                </a>
                
                <div class="d-flex align-items-center gap-2">
                    <button onclick="toggleArticleBookmark()" class="btn btn-outline-dark rounded-3 px-2 py-2 d-flex align-items-center gap-1" id="article-bookmark-btn">
                        <i class="fas fa-bookmark"></i>
                        <span class="d-none d-sm-inline">Bookmark</span>
                    </button>
                    <a href="/" class="btn btn-outline-dark rounded-3 px-2 py-2 d-flex align-items-center gap-1">
                        <i class="fas fa-home"></i>
                        <span class="d-none d-sm-inline">Home</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Article Content -->
    <main class="flex-1 py-5">
        <div class="container">
            <article class="bg-white bg-opacity-95 border-0 shadow-sm rounded-4 overflow-hidden" style="border: 1px solid rgba(99, 102, 241, 0.08);">
                <div class="px-4 px-md-5 py-5 border-bottom bg-white" style="border-color: rgba(0,0,0,0.05);">
                    <h1 class="fw-bold text-dark mb-4">{{title}}</h1>
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="d-flex align-items-center text-muted small">
                            <i class="far fa-calendar me-2 text-primary"></i>
                            <span>{{createDate}}</span>
                        </div>
                        <span class="category-badge">{{label}}</span>
                    </div>
                    {{#img}}
                    <div class="mt-4 mx-n4 mx-md-n5">
                        <img src="{{img}}" alt="{{title}}" class="w-100" style="max-height: 450px; object-fit: cover;">
                    </div>
                    {{/img}}
                </div>

                <div class="px-4 px-md-5 py-5">
                    <div id="raw-content" class="d-none">{{content}}</div>
                    <div id="article-content" class="article-content">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="text-muted">Loading content...</p>
                        </div>
                    </div>
                </div>

                <div class="px-4 px-md-5 py-4 border-top bg-light" style="border-color: rgba(0,0,0,0.05);">
                    <div class="d-flex flex-column sm:flex-row justify-content-between align-items-center gap-4">
                        <a href="/" class="btn btn-primary-custom text-white">
                            <i class="fas fa-arrow-left me-2"></i>
                            Back to Home
                        </a>
                        
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small me-2">Share this article</span>
                            <div class="d-flex gap-2">
                                <button onclick="shareOnTwitter()" class="btn-share" title="Share on Twitter">
                                    <i class="fab fa-twitter"></i>
                                </button>
                                <button onclick="shareOnFacebook()" class="btn-share" title="Share on Facebook">
                                    <i class="fab fa-facebook"></i>
                                </button>
                                <button onclick="shareOnLinkedIn()" class="btn-share" title="Share on LinkedIn">
                                    <i class="fab fa-linkedin"></i>
                                </button>
                                <button onclick="copyShareLink()" class="btn-share border-0 bg-transparent" title="Copy link">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom mt-auto py-4">
        <div class="container text-center">
            <p class="text-muted mb-0 small">{{copyRight}}</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getShareUrl() {
            return window.location.href;
        }

        function getShareTitle() {
            return document.title.replace(` - {{siteName}}`, '');
        }

        function shareOnTwitter() {
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(getShareTitle())}&url=${encodeURIComponent(getShareUrl())}`;
            window.open(url, '_blank', 'width=600,height=400');
        }

        function shareOnFacebook() {
            const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(getShareUrl())}`;
            window.open(url, '_blank', 'width=600,height=400');
        }

        function shareOnLinkedIn() {
            const url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(getShareUrl())}`;
            window.open(url, '_blank', 'width=600,height=400');
        }

        async function copyShareLink() {
            try {
                await navigator.clipboard.writeText(getShareUrl());
                showNotification('Link copied to clipboard!', 'success');
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = getShareUrl();
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showNotification('Link copied to clipboard!', 'success');
            }
        }

        function showNotification(message, type = 'success') {
            const colors = {
                success: 'bg-success',
                warning: 'bg-warning',
                error: 'bg-danger',
                info: 'bg-primary'
            };
            
            const icons = {
                success: 'fa-check-circle',
                warning: 'fa-bookmark',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            
            const notification = document.createElement('div');
            notification.className = `notification fixed-top-0 end-0 m-3 p-3 rounded-3 shadow-lg text-white fw-medium d-flex align-items-center gap-2 ${colors[type] || colors.info}`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 250px;';
            notification.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i>${message}`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(120%)';
                notification.style.opacity = '0';
                notification.style.transition = 'all 0.5s ease';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 500);
            }, 3000);
        }

        function getArticlePermalink() {
            const path = window.location.pathname;
            const parts = path.split('/');
            return parts[parts.length - 1];
        }

        function getArticleBookmarks() {
            try {
                return JSON.parse(localStorage.getItem('blog_bookmarks') || '[]');
            } catch {
                return [];
            }
        }

        function saveArticleBookmarks(bookmarks) {
            try {
                localStorage.setItem('blog_bookmarks', JSON.stringify(bookmarks));
            } catch (error) {
                console.error('Error saving bookmarks:', error);
            }
        }

        function isArticleBookmarked(permalink) {
            const bookmarks = getArticleBookmarks();
            return bookmarks.some(bookmark => bookmark.permalink === permalink);
        }

        function toggleArticleBookmark() {
            const permalink = getArticlePermalink();
            const title = document.title.replace(' - {{siteName}}', '');
            const bookmarks = getArticleBookmarks();
            const existingIndex = bookmarks.findIndex(bookmark => bookmark.permalink === permalink);
            const btn = document.getElementById('article-bookmark-btn');
            
            if (existingIndex > -1) {
                bookmarks.splice(existingIndex, 1);
                saveArticleBookmarks(bookmarks);
                if (btn) {
                    btn.classList.remove('text-primary');
                    btn.classList.add('text-dark');
                }
                showNotification('Bookmark removed', 'warning');
            } else {
                bookmarks.push({
                    permalink,
                    title,
                    img: '',
                    label: '',
                    bookmarkedAt: new Date().toISOString()
                });
                saveArticleBookmarks(bookmarks);
                if (btn) {
                    btn.classList.remove('text-dark');
                    btn.classList.add('text-primary');
                }
                showNotification('Article bookmarked!', 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Strip credentials from URL to prevent fetch issues
            if (window.location.href.includes('@')) {
                const newUrl = window.location.href.replace(/\/\/.*@/, '//');
                history.replaceState(null, '', newUrl);
            }
            
            const permalink = getArticlePermalink();
            const btn = document.getElementById('article-bookmark-btn');
            if (btn && isArticleBookmarked(permalink)) {
                btn.classList.remove('text-dark');
                btn.classList.add('text-primary');
            }
        });

        function renderMarkdown() {
            const contentElement = document.getElementById('article-content');
            const rawContentElement = document.getElementById('raw-content');
            
            let rawContent = rawContentElement.textContent;
            rawContent = rawContent.replace(/\\n/g, '\n').replace(/\\r/g, '\r');
            
            if (!rawContent || rawContent.trim() === '') {
                contentElement.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-file-alt text-muted mb-3" style="font-size: 2rem; opacity: 0.3;"></i>
                        <p class="text-muted">No content available for this article.</p>
                    </div>
                `;
                return;
            }
            
            if (window.marked && window.hljs) {
                try {
                    marked.setOptions({
                        highlight: function(code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                try {
                                    return hljs.highlight(code, { language: lang }).value;
                                } catch (err) {
                                    console.warn('Error highlighting code:', err);
                                }
                            }
                            return hljs.highlightAuto(code).value;
                        },
                        breaks: true,
                        gfm: true
                    });
                    
                    const htmlContent = marked.parse(rawContent);
                    contentElement.innerHTML = htmlContent;
                    
                    const codeBlocks = document.querySelectorAll('pre code');
                    codeBlocks.forEach(block => {
                        if (!block.classList.contains('hljs')) {
                            block.classList.add('hljs');
                        }
                    });
                } catch (error) {
                    console.error('Error parsing markdown:', error);
                    contentElement.innerHTML = `
                        <div class="alert alert-warning">
                            <p class="mb-0">Error rendering content. Showing raw text instead.</p>
                        </div>
                        <pre class="whitespace-pre-wrap bg-white p-4 rounded-3 text-sm overflow-x-auto border">${rawContent}</pre>
                    `;
                }
            } else {
                contentElement.innerHTML = `<pre class="whitespace-pre-wrap bg-white p-4 rounded-3 text-sm overflow-x-auto border">${rawContent}</pre>`;
            }
        }
        
        document.addEventListener('touchstart', function() {}, { passive: true });
        document.addEventListener('DOMContentLoaded', renderMarkdown);
    </script>
    
    {{codeBeforBody}}
</body>
</html>
