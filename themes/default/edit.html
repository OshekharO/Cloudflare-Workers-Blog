<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{action}} Article - {{siteName}}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- EasyMDE -->
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(99, 102, 241, 0.08);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        
        .EasyMDEContainer .CodeMirror {
            border: 2px solid #eef2ff !important;
            border-radius: 0 0 16px 16px !important;
            font-size: 0.9375rem;
            min-height: 350px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.9) !important;
        }
        
        .EasyMDEContainer .CodeMirror:focus-within {
            border-color: #4f46e5 !important;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .EasyMDEContainer .editor-toolbar {
            border: 2px solid #eef2ff !important;
            border-bottom: none !important;
            border-radius: 16px 16px 0 0 !important;
            padding: 0.75rem !important;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%) !important;
        }
        
        .EasyMDEContainer .editor-toolbar button {
            border-radius: 10px !important;
            transition: all 0.3s ease;
            color: #4f46e5 !important;
        }
        
        .EasyMDEContainer .editor-toolbar button:hover {
            background: rgba(79, 70, 229, 0.1) !important;
        }
        
        .EasyMDEContainer .editor-toolbar button.active {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%) !important;
            color: white !important;
        }
        
        .form-control-custom {
            border: 2px solid #eef2ff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-control-custom:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: white;
        }
        
        .form-select-custom {
            border: 2px solid #eef2ff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-select-custom:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            color: white;
        }
        
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
            color: white;
        }
        
        .btn-secondary-custom {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #eef2ff;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #475569;
        }
        
        .btn-secondary-custom:hover {
            background: white;
            border-color: #4f46e5;
            transform: translateY(-2px);
            color: #4f46e5;
        }
        
        .btn-magic {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            border: none;
            padding: 10px 16px;
            border-radius: 0 12px 12px 0;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn-magic:hover {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            transform: scale(1.05);
            color: white;
        }
        
        .form-label {
            color: #334155;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .notification {
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
    
    {{codeBeforHead}}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar-custom sticky-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-3">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 d-flex align-items-center justify-content-center me-3" 
                         style="width: 44px; height: 44px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                        <i class="fas fa-edit text-white fs-5"></i>
                    </div>
                    <div>
                        <h1 class="fs-5 fw-bold text-dark mb-0">{{action}} Article</h1>
                        <p class="text-muted small mb-0 d-none d-sm-block">Create amazing content</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="/admin/" class="btn btn-secondary-custom px-3 py-2 d-flex align-items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        <span class="d-none d-sm-inline">Back</span>
                    </a>
                    <a href="/" class="btn btn-secondary-custom px-3 py-2 d-flex align-items-center gap-2">
                        <i class="fas fa-eye"></i>
                        <span class="d-none d-sm-inline">View</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="glass-card overflow-hidden">
            <div class="px-4 px-md-5 py-4 border-bottom bg-white" style="border-radius: 24px 24px 0 0; border-color: rgba(0,0,0,0.05);">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 44px; height: 44px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                        <i class="fas fa-article text-white"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold text-dark mb-0">{{action}} Article</h2>
                        <p class="text-muted small mb-0">Fill in the details below</p>
                    </div>
                </div>
            </div>
            
            <form id="article-form" class="p-4 p-md-5">
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="permalink" class="form-label fw-semibold">
                            <i class="fas fa-link me-2 text-primary"></i>Permalink *
                        </label>
                        <div class="input-group">
                            <input type="text" id="permalink" required pattern="[a-z0-9-]+" 
                                   class="form-control form-control-custom rounded-end-0" placeholder="article-url-slug">
                            <button type="button" id="generate-slug-btn" title="Generate from title"
                                    class="btn btn-magic">
                                <i class="fas fa-magic"></i>
                            </button>
                        </div>
                        <p class="text-muted small mt-2">
                            <i class="fas fa-info-circle me-1"></i>URL-friendly identifier
                        </p>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="label" class="form-label fw-semibold">
                            <i class="fas fa-tag me-2 text-primary"></i>Category *
                        </label>
                        <select id="label" required class="form-select form-select-custom w-100">
                            <option value="">Choose a category...</option>
                            <option value="Technology">Technology</option>
                            <option value="Lifestyle">Lifestyle</option>
                            <option value="Travel">Travel</option>
                            <option value="Food">Food</option>
                            <option value="Business">Business</option>
                            <option value="Science">Science</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="title" class="form-label fw-semibold">
                        <i class="fas fa-heading me-2 text-primary"></i>Title *
                    </label>
                    <input type="text" id="title" required 
                           class="form-control form-control-custom w-100" placeholder="Enter your article title...">
                </div>
                
                <div class="mb-4">
                    <label for="img" class="form-label fw-semibold">
                        <i class="fas fa-image me-2 text-primary"></i>Featured Image URL
                    </label>
                    <input type="url" id="img" 
                           class="form-control form-control-custom w-100"
                           placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label for="createDate" class="form-label fw-semibold">
                            <i class="fas fa-calendar me-2 text-primary"></i>Publish Date *
                        </label>
                        <input type="datetime-local" id="createDate" required 
                               class="form-control form-control-custom w-100">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="status" class="form-label fw-semibold">
                            <i class="fas fa-toggle-on me-2 text-primary"></i>Status
                        </label>
                        <select id="status" class="form-select form-select-custom w-100">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-5">
                    <label for="content" class="form-label fw-semibold mb-3">
                        <i class="fas fa-file-alt me-2 text-primary"></i>Content *
                    </label>
                    <textarea id="content"></textarea>
                </div>
                
                <div class="d-flex flex-column sm:flex-row justify-content-end gap-3 pt-4 border-top">
                    <button type="button" onclick="window.history.back()" 
                            class="btn btn-secondary-custom order-2 sm:order-1">
                        <i class="fas fa-times me-2"></i>Cancel
                    </button>
                    <button type="submit" 
                            class="btn btn-primary-custom order-1 sm:order-2">
                        <i class="fas fa-check me-2"></i>Save Article
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script>
        let easyMDE;
        let isEditing = false;
        let currentPermalink = '';

        easyMDE = new EasyMDE({ 
            element: document.getElementById('content'),
            spellChecker: false,
            status: false,
            autosave: {
                enabled: false
            },
            toolbar: [
                'bold', 'italic', 'heading', '|',
                'quote', 'unordered-list', 'ordered-list', '|',
                'link', 'image', '|',
                'preview', 'side-by-side', 'fullscreen', '|',
                'guide'
            ]
        });

        const urlParams = new URLSearchParams(window.location.search);
        const permalink = urlParams.get('permalink');
        
        if (permalink) {
            isEditing = true;
            currentPermalink = permalink;
            loadArticle(permalink);
        }

        document.getElementById('createDate').value = new Date().toISOString().slice(0, 16);

        async function loadArticle(permalink) {
            try {
                const response = await fetch('/api/articles/' + permalink);
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }
                
                const article = await response.json();
                
                document.getElementById('permalink').value = article.permalink;
                document.getElementById('permalink').readOnly = true;
                document.getElementById('permalink').classList.add('bg-light');
                document.getElementById('title').value = article.title;
                document.getElementById('img').value = article.img || '';
                document.getElementById('label').value = article.label;
                document.getElementById('createDate').value = new Date(article.createDate).toISOString().slice(0, 16);
                
                if (article.status) {
                    document.getElementById('status').value = article.status;
                }
                
                easyMDE.value(article.content);
            } catch (error) {
                console.error('Error loading article:', error);
                showNotification('Error loading article: ' + error.message, 'error');
                setTimeout(() => {
                    window.location.href = '/admin/';
                }, 2000);
            }
        }

        document.getElementById('article-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></i>Saving...';

            const formData = {
                permalink: document.getElementById('permalink').value,
                title: document.getElementById('title').value,
                img: document.getElementById('img').value,
                label: document.getElementById('label').value,
                createDate: document.getElementById('createDate').value,
                content: easyMDE.value(),
                status: document.getElementById('status').value
            };

            try {
                const url = isEditing ? '/api/articles/' + currentPermalink : '/api/articles';
                const method = isEditing ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const message = isEditing ? 'Article updated successfully!' : 'Article created successfully!';
                    showNotification(message + (formData.status === 'draft' ? ' (Saved as draft)' : ''), 'success');
                    setTimeout(() => {
                        window.location.href = '/admin/';
                    }, 1500);
                } else {
                    const error = await response.text();
                    throw new Error(error);
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Error saving article: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        function generateSlugLocal(title) {
            if (!title) return '';
            return title
                .toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/[\s_-]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        document.getElementById('generate-slug-btn').addEventListener('click', async () => {
            const title = document.getElementById('title').value;
            if (!title) {
                showNotification('Please enter a title first', 'warning');
                return;
            }

            const btn = document.getElementById('generate-slug-btn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></i>';

            try {
                const response = await fetch('/api/generate-slug', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('permalink').value = data.slug;
                    showNotification('Slug generated!', 'success');
                } else {
                    document.getElementById('permalink').value = generateSlugLocal(title);
                    showNotification('Slug generated locally', 'success');
                }
            } catch (error) {
                document.getElementById('permalink').value = generateSlugLocal(title);
                showNotification('Slug generated locally', 'success');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });

        document.getElementById('title').addEventListener('blur', () => {
            const permalinkField = document.getElementById('permalink');
            if (!permalinkField.value && !isEditing) {
                const title = document.getElementById('title').value;
                if (title) {
                    permalinkField.value = generateSlugLocal(title);
                }
            }
        });

        function showNotification(message, type = 'success') {
            const colors = {
                success: 'bg-success',
                warning: 'bg-warning',
                error: 'bg-danger',
                info: 'bg-primary'
            };
            
            const icons = {
                success: 'fa-check-circle',
                warning: 'fa-exclamation-triangle',
                error: 'fa-times-circle',
                info: 'fa-info-circle'
            };
            
            const notification = document.createElement('div');
            notification.className = `notification fixed-top-0 end-0 m-3 p-3 rounded-3 shadow-lg text-white fw-medium d-flex align-items-center gap-2 ${colors[type] || colors.info}`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 250px;';
            notification.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i>${message}`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(120%)';
                notification.style.opacity = '0';
                notification.style.transition = 'all 0.5s ease';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 500);
            }, 3000);
        }
    </script>
    
    {{codeBeforBody}}
</body>
</html>
